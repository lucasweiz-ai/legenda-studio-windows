[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glimo-editor"
version = "0.2.1"
description = "Editor local de vídeo com cortes, projetos recuperáveis e legendas"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "faster-whisper>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
