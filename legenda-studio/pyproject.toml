[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legenda-studio"
version = "0.1.0"
description = "Editor local de vídeo com legendas palavra a palavra"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "faster-whisper>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]