name: Build Windows portátil - Legenda Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Montar aplicativo portátil
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name LegendaStudio `
            --collect-data faster_whisper `
            --add-data "assets;assets" `
            --add-data "runtime;runtime" `
            app.py
        shell: pwsh

      - name: Copiar LEIA-ME.md para a pasta de distribuição
        run: |
          Copy-Item LEIA-ME.md -Destination dist\LegendaStudio\LEIA-ME.md
        shell: pwsh

      - name: Teste de inicialização
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\LegendaStudio\LegendaStudio.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited -and $process.ExitCode -ne 0) {
            throw "LegendaStudio.exe encerrou com código $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Compactar
        shell: pwsh
        run: |
          Compress-Archive -Path dist\LegendaStudio -DestinationPath dist\LegendaStudio-windows-x64.zip -Force

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: LegendaStudio-windows-x64
          path: |
            dist\LegendaStudio\
            dist\LegendaStudio-windows-x64.zip
