name: Build Windows portátil - Legenda Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: legenda-studio-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: legenda-studio

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legenda-studio/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Testar núcleo e imports
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q app.py legenda_studio scripts
          python -c "import PySide6, faster_whisper; print('Dependências importadas com sucesso.')"

      - name: Baixar FFmpeg e fonte
        run: python scripts/fetch_runtime.py

      - name: Testar corte e exportação reais
        run: python -m scripts.e2e_smoke

      - name: Montar aplicativo portátil
        run: python scripts/build_windows.py

      - name: Testar integridade do pacote
        run: |
          Remove-Item "LegendaStudio-self-test.log" -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "dist\LegendaStudio\LegendaStudio.exe" -ArgumentList "--self-test" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw "O autoteste do pacote excedeu 60 segundos"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            if (Test-Path "LegendaStudio-self-test.log") {
              Get-Content "LegendaStudio-self-test.log"
            }
            throw "O autoteste do pacote falhou com código $($process.ExitCode)"
          }

      - name: Testar inicialização da interface
        run: |
          Remove-Item "LegendaStudio-startup-test.log" -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "dist\LegendaStudio\LegendaStudio.exe" -ArgumentList "--startup-test" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw "O teste da interface excedeu 60 segundos"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            if (Test-Path "LegendaStudio-startup-test.log") {
              Get-Content "LegendaStudio-startup-test.log"
            }
            throw "O teste da interface falhou com código $($process.ExitCode)"
          }

      - name: Compactar aplicativo
        run: Compress-Archive -Path dist\LegendaStudio -DestinationPath dist\LegendaStudio-windows-x64.zip -Force

      - name: Publicar aplicativo
        uses: actions/upload-artifact@v7
        with:
          name: LegendaStudio-windows-x64
          path: legenda-studio/dist/LegendaStudio-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
